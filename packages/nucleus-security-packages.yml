integration_approach:
  note: >-
    Nucleus's integration strategy is connectors, not SDKs. Roughly 30 third-party scanner
    and ticketing integrations are operated as first-party connectors (visible as individual
    components on https://status.nucleussec.com/) rather than shipped as client libraries.
    The provider's documented answer for programmatic access is the raw REST API with an
    `x-apikey` header, and its documented answer for AI access is the hosted MCP server. For
    a local MCP client it points customers at the third-party open-source
    `mcp-openapi-proxy` project rather than shipping one.
  reference: https://nucleussec.com/platform/integrations/

gaps:
- No first-party client library in any language on any registry.
