name: Nucleus Security Packages and SDKs
description: >-
  Nucleus Security publishes no first-party client SDK on any public package registry. The
  only Nucleus-authored public code artifact is a Burp Suite extension on GitHub, last
  pushed in 2023 and distributed as source with no registry release. The one Python
  package on PyPI that wraps the Nucleus API is explicitly third-party.
generated: '2026-08-26'
method: searched
source: >-
  Searched npm (registry.npmjs.org search), PyPI, and the GitHub organization
  https://github.com/nucleus-security, plus the Nucleus help center SDK/API pages,
  2026-08-26. Registry metadata read from registry.npmjs.org and pypi.org/pypi/*/json.
official_sdk_count: 0
package_count: 2

packages:
- name: nucleus-security-api-wrapper
  registry: pypi
  url: https://pypi.org/project/nucleus-security-api-wrapper/
  language: python
  official: false
  version: 0.1.0
  published: '2024-11-08'
  repository: https://github.com/locm-ai/Nucleus-Security-Python-API-Wrapper
  author: Loc Mai (locm.ai)
  summary: Unofficial Python SDK for the Nucleus Security API - A third-party implementation.
  note: >-
    NOT first-party. The package's own PyPI summary describes itself as "Unofficial ... A
    third-party implementation" and its repository is under the locm-ai GitHub account, not
    nucleus-security. Its declared home_page field points at
    https://github.com/nucleus/nucleus-python-sdk, a repository that does not exist under
    any Nucleus organization - a misleading metadata field, not evidence of a first-party
    SDK. Still on its initial 0.1.0 release from November 2024 with no subsequent version.
    Recorded here so the absence of a first-party SDK is not mistaken for the presence of one.
  currency_signal: >-
    Single release, 21 months old as of this pass, against a platform that shipped a new
    MCP server in 2026. Treat as unmaintained.

