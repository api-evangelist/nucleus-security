aid: nucleus-security
name: Nucleus Security
description: >-
  Nucleus Security is a risk-based vulnerability and exposure management platform that
  unifies findings from across an organization's scanning estate - network, application,
  cloud, container and penetration-test tooling - into a single normalized view, then
  prioritizes and automates remediation against it. The platform ingests from roughly
  thirty first-party connectors (Tenable, Qualys, Rapid7, Snyk, Checkmarx, Crowdstrike,
  Orca, Prisma and others), enriches findings with threat intelligence including CISA KEV,
  EPSS, CVSS v3/v4 and Nucleus Insights exploitation signals, and drives remediation
  through ServiceNow, Jira and other ticketing systems. Programmatic access is a
  first-class deployment model: every platform capability is exposed through an
  API-key-authenticated REST API documented in-console with Swagger, and Nucleus ships a
  hosted Model Context Protocol server so AI clients can query Nucleus data under the same
  RBAC and Asset Group Access Control enforced in the UI. Nucleus also publishes an open,
  unauthenticated vulnerability intelligence API on its corporate domain, and a
  FedRAMP Moderate government offering, NucleusGov.
