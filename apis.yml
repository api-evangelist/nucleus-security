apis:
- name: Nucleus Security Platform REST API
  description: >-
    The Nucleus platform API. Every platform capability is exposed over REST, documented with Swagger
    inside the authenticated customer console, and authenticated with a static API key in an x-apikey
    header. The base URL is templated per tenant - the instance name is the customer's own subdomain.
    Publicly documented operations cover project-scoped metrics, findings search, finding processing rules,
    bulk data export and async job polling.
  humanURL: https://help.nucleussec.com/docs/api-access
  baseURL: https://[instance-name].nucleussec.com/nucleus/api
  tags:
  - Vulnerability Management
  - Findings
  - Assets
  - Metrics
  properties:
  - type: Documentation
    url: https://help.nucleussec.com/docs/api-access
  - type: Authentication
    url: authentication/nucleus-security-authentication.yml
  - type: Conventions
    url: conventions/nucleus-security-conventions.yml
  - type: Lifecycle
    url: lifecycle/nucleus-security-lifecycle.yml
- name: Nucleus MCP Server
  description: >-
    Hosted remote Model Context Protocol server included with the Nucleus platform, reachable at a per-tenant
    URL. Exposes project, asset, finding/vulnerability and Nucleus Query Language tools to AI clients
    over OAuth, enforcing the same RBAC and Asset Group Access Control as the console, evaluated at query
    time. Tested by the provider with ChatGPT, Claude and Augment Code.
  humanURL: https://nucleussec.com/platform/mcp-server/
  baseURL: https://[your-nucleus-instance].nucleussec.com/nucleus/mcp
  tags:
  - MCP
  - AI
  - Agents
  properties:
